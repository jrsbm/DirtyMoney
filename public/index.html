<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dirty Money | Investigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Righteous&display=swap" rel="stylesheet">
    <style>
        :root {
            --clr-bg-dark: oklch(8% 0.01 220);
            --clr-bg-surface: oklch(14% 0.015 220);
            --clr-text-primary: oklch(92% 0.02 0);
            --clr-text-muted: oklch(68% 0.02 220);
            --clr-authentic: oklch(52% 0.18 240);
            --clr-fraudulent: oklch(52% 0.18 20);
            --clr-border: oklch(25% 0.02 220);
            
            --font-display: 'Righteous', sans-serif;
            --font-body: 'Courier Prime', monospace;
            
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--clr-bg-dark);
            color: var(--clr-text-primary);
            line-height: 1.6;
            font-size: 14px;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255,255,255,0.02) 2px,
                    rgba(255,255,255,0.02) 4px
                );
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--space-2xl) var(--space-lg);
        }

        /* Header */
        .header {
            margin-bottom: var(--space-2xl);
            border-bottom: 2px solid var(--clr-border);
            padding-bottom: var(--space-lg);
        }

        .header-title {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: var(--space-xs);
            text-transform: uppercase;
            color: var(--clr-text-primary);
        }

        .header-subtitle {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: var(--clr-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* Input Groups */
        .input-group {
            display: flex;
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }

        input[type="text"] {
            flex: 1;
            padding: var(--space-md);
            background: var(--clr-bg-surface);
            border: 1px solid var(--clr-border);
            color: var(--clr-text-primary);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: border-color 0.2s, outline 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--clr-authentic);
        }

        input::placeholder {
            color: var(--clr-text-muted);
        }

        /* Buttons */
        button {
            padding: var(--space-md) var(--space-lg);
            font-family: var(--font-display);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease-out;
            position: relative;
            overflow: hidden;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--clr-fraudulent);
            color: var(--clr-text-primary);
        }

        .btn-primary:hover {
            background: oklch(48% 0.19 20);
        }

        .btn-secondary {
            background: var(--clr-authentic);
            color: var(--clr-text-primary);
        }

        .btn-secondary:hover {
            background: oklch(48% 0.19 240);
        }

        .btn-danger {
            background: oklch(45% 0.16 0);
            color: var(--clr-text-primary);
        }

        .btn-danger:hover {
            background: oklch(42% 0.16 0);
        }

        /* Role Card - Classified Document Style */
        #role-card {
            display: none;
            background: var(--clr-bg-surface);
            border: 2px solid var(--clr-border);
            padding: var(--space-xl);
            margin-bottom: var(--space-lg);
            position: relative;
        }

        #role-card::before {
            content: 'CLASSIFIED';
            position: absolute;
            top: var(--space-md);
            right: var(--space-md);
            font-family: var(--font-display);
            font-size: 0.75rem;
            color: var(--clr-fraudulent);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        #role-card h3 {
            font-family: var(--font-display);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--clr-text-muted);
            margin-bottom: var(--space-md);
        }

        #myRole {
            font-family: var(--font-display);
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: var(--space-md);
            text-transform: uppercase;
        }

        #role-desc {
            font-size: 0.9rem;
            color: var(--clr-text-muted);
            line-height: 1.7;
        }

        /* Player List */
        .players-section {
            margin-bottom: var(--space-2xl);
        }

        .section-label {
            font-family: var(--font-display);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--clr-text-muted);
            margin-bottom: var(--space-md);
            display: block;
        }

        #playerList {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-md);
        }

        #playerList li {
            background: var(--clr-bg-surface);
            border: 1px solid var(--clr-border);
            padding: var(--space-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            transition: all 0.2s ease-out;
            position: relative;
        }

        #playerList li:hover {
            border-color: var(--clr-authentic);
            background: oklch(16% 0.015 220);
        }

        #playerList li[data-player-status="waiting"] {
            opacity: 0.6;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: var(--space-md);
        }

        .player-name {
            font-weight: 700;
            color: var(--clr-text-primary);
            flex: 1;
        }

        .player-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--clr-text-muted);
        }

        .player-status.ready {
            color: var(--clr-authentic);
            font-weight: 700;
        }

        .player-status.voted {
            color: var(--clr-authentic);
            font-weight: 700;
        }

        .player-status.eliminated {
            text-decoration: line-through;
            color: var(--clr-fraudulent);
        }

        .badge {
            display: inline-block;
            font-family: var(--font-display);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: var(--space-xs) var(--space-sm);
            margin-top: var(--space-xs);
            font-weight: 700;
        }

        .badge-trader {
            color: oklch(75% 0.1 50);
            background: oklch(18% 0.08 50);
        }

        .badge-supplier {
            color: var(--clr-authentic);
            background: oklch(22% 0.15 240);
        }

        .badge-identity {
            color: var(--clr-fraudulent);
            background: oklch(18% 0.12 20);
        }

        /* Zones */
        .zone {
            background: var(--clr-bg-surface);
            border: 1px solid var(--clr-border);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
        }

        .zone-title {
            font-family: var(--font-display);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--space-md);
            color: var(--clr-text-primary);
        }

        #election-ui { display: none; }
        #voting-ui { display: none; border-top: 2px solid var(--clr-authentic); }
        #legislative-ui { display: none; border-top: 2px solid oklch(60% 0.12 270); }
        #power-ui { display: none; border-top: 2px solid oklch(60% 0.12 50); }

        #voting-ui .zone-title { color: var(--clr-authentic); }
        #legislative-ui .zone-title { color: oklch(60% 0.12 270); }
        #power-ui .zone-title { color: oklch(60% 0.12 50); }

        #voting-ui #voting-announcement {
            font-family: var(--font-body);
            font-size: 1rem;
            margin-bottom: var(--space-md);
            color: var(--clr-text-primary);
        }

        #ready-ui {
            margin-top: var(--space-lg);
        }

        #ready-ui button {
            width: 100%;
        }

        /* Policy Cards */
        #policy-hand {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
            flex-wrap: wrap;
            margin-top: var(--space-lg);
        }

        .policy-card {
            width: 100px;
            height: 140px;
            border: 2px solid var(--clr-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            font-size: 0.8rem;
            text-align: center;
            padding: var(--space-sm);
        }

        .policy-card:hover {
            transform: translateY(-4px);
            border-color: var(--clr-text-primary);
        }

        .card-authentic {
            background: oklch(18% 0.12 240);
            color: var(--clr-authentic);
            border-color: var(--clr-authentic);
        }

        .card-fraudulent {
            background: oklch(18% 0.12 20);
            color: var(--clr-fraudulent);
            border-color: var(--clr-fraudulent);
        }

        /* Messages */
        #game-message {
            display: none;
            background: var(--clr-bg-surface);
            border-top: 3px solid var(--clr-authentic);
            border-left: 1px solid var(--clr-border);
            border-right: 1px solid var(--clr-border);
            border-bottom: 1px solid var(--clr-border);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
            font-family: var(--font-body);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        #game-message.success {
            border-top-color: var(--clr-authentic);
            color: var(--clr-authentic);
        }

        #game-message.failure {
            border-top-color: var(--clr-fraudulent);
            color: var(--clr-fraudulent);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md);
            background: var(--clr-bg-surface);
            border: 1px solid var(--clr-border);
            margin-top: var(--space-xl);
            gap: var(--space-lg);
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .status-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--clr-text-muted);
        }

        .status-value {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--clr-text-primary);
            text-transform: uppercase;
        }

        /* Funds Tracker */
        #funds-tracker {
            display: none;
            position: fixed;
            top: var(--space-lg);
            right: var(--space-lg);
            width: 220px;
            background: var(--clr-bg-surface);
            border: 2px solid var(--clr-border);
            padding: var(--space-lg);
            text-align: center;
            z-index: 100;
        }

        #funds-tracker.warning {
            border-color: var(--clr-fraudulent);
        }

        .funds-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--clr-text-muted);
            margin-bottom: var(--space-md);
        }

        #funds-amount {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            color: var(--clr-text-primary);
            margin-bottom: var(--space-md);
        }

        #funds-tracker.warning #funds-amount {
            color: var(--clr-fraudulent);
        }

        .funds-warning {
            font-size: 0.75rem;
            color: var(--clr-text-muted);
        }

        /* Scoreboard */
        #scoreboard {
            display: none;
            grid-template-columns: 1fr auto 1fr;
            gap: var(--space-xl);
            margin: var(--space-lg) 0;
            padding: var(--space-lg);
            background: var(--clr-bg-surface);
            border: 1px solid var(--clr-border);
            align-items: center;
        }

        .score-column {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .score-label {
            font-family: var(--font-display);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--clr-text-muted);
        }

        .score-value {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--clr-text-primary);
        }

        .score-authentic .score-label { color: var(--clr-authentic); }
        .score-authentic .score-value { color: var(--clr-authentic); }
        .score-fraudulent .score-label { color: var(--clr-fraudulent); }
        .score-fraudulent .score-value { color: var(--clr-fraudulent); }

        .score-divider {
            width: 2px;
            height: 60px;
            background: var(--clr-border);
        }

        /* Power Results */
        #private-result {
            display: none;
            background: oklch(16% 0.1 180);
            border: 2px solid oklch(45% 0.15 180);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
            border-left: 4px solid oklch(45% 0.15 180);
        }

        #private-result > div:first-child {
            font-family: var(--font-display);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: oklch(60% 0.15 180);
            margin-bottom: var(--space-md);
        }

        #private-result button {
            margin-top: var(--space-md);
            background: oklch(45% 0.15 180);
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: var(--space-lg) var(--space-md);
            }

            .header-title {
                font-size: 2rem;
            }

            .input-group {
                flex-direction: column;
            }

            #playerList {
                grid-template-columns: 1fr;
            }

            #funds-tracker {
                top: auto;
                bottom: var(--space-lg);
                right: var(--space-lg);
                left: auto;
            }

            #scoreboard {
                grid-template-columns: 1fr auto 1fr;
                gap: var(--space-md);
                padding: var(--space-md);
            }

            .score-divider {
                height: 40px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header class="header">
        <h1 class="header-title">dirty money</h1>
        <p class="header-subtitle">food fraud investigation</p>
    </header>

    <!-- Join Game Setup -->
    <div id="setup-ui">
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Your Code Name...">
            <button class="btn-primary" onclick="joinGame()">enter</button>
        </div>
    </div>

    <!-- Role Reveal Card -->
    <div id="role-card">
        <h3>Player Profile</h3>
        <h2 id="myRole">???</h2>
        <p id="role-desc"></p>
    </div>

    <!-- Message Alert -->
    <div id="game-message"></div>

    <!-- Scoreboard -->
    <div id="scoreboard">
        <div class="score-column score-authentic">
            <span class="score-label">Authentic Batches</span>
            <span class="score-value" id="score-auth">0 / 5</span>
        </div>
        <div class="score-divider"></div>
        <div class="score-column score-fraudulent">
            <span class="score-label">Fraudulent Batches</span>
            <span class="score-value" id="score-fraud">0 / 6</span>
        </div>
    </div>

    <!-- Ready Button -->
    <div id="ready-ui">
        <button class="btn-secondary" id="readyBtn" onclick="toggleReady()" style="width: 100%;">mark ready</button>
    </div>

    <!-- Players Board -->
    <div class="players-section">
        <label class="section-label">players</label>
        <ul id="playerList"></ul>
    </div>

    <!-- Election Phase -->
    <div id="election-ui" class="zone">
        <div class="zone-title">nominate supplier</div>
        <p style="margin: var(--space-md) 0;">Select a player to nominate:</p>
        <div id="supplier-candidates" style="display: flex; flex-wrap: wrap; gap: var(--space-md);"></div>
    </div>

    <!-- Voting Phase -->
    <div id="voting-ui" class="zone">
        <div class="zone-title">cast your vote</div>
        <p id="voting-announcement" style="margin: var(--space-md) 0;"></p>
        <div style="display: flex; gap: var(--space-md); margin-top: var(--space-md);">
            <button class="btn-secondary" onclick="sendVote(true)" style="flex: 1;">✓ accept</button>
            <button class="btn-danger" onclick="sendVote(false)" style="flex: 1;">✗ reject</button>
        </div>
    </div>

    <!-- Legislative Phase -->
    <div id="legislative-ui" class="zone">
        <div class="zone-title">discard batch</div>
        <h4 id="hand-instruction" style="font-family: var(--font-body); text-transform: uppercase; letter-spacing: 1px; margin: var(--space-md) 0; color: var(--clr-text-muted);"></h4>
        <div id="policy-hand"></div>
    </div>

    <!-- Power Phase -->
    <div id="power-ui" class="zone">
        <div class="zone-title" id="power-title">special power</div>
        <div id="power-targets" style="display: flex; flex-wrap: wrap; gap: var(--space-md); margin-top: var(--space-md);"></div>
    </div>

    <!-- Private Results -->
    <div id="private-result"></div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">Investigation Phase</span>
            <span class="status-value" id="gameStatus">lobby</span>
        </div>
    </div>
</div>

<!-- Funds Tracker -->
<div id="funds-tracker">
    <div class="funds-label">company funds</div>
    <div id="funds-amount">€3M</div>
    <div class="funds-warning">Avoid bankruptcy</div>
</div>

<script>
    let myPlayerId = null;

    async function joinGame() {
        const nameInput = document.getElementById('playerName');
        const name = nameInput.value.trim();
        const joinBtn = document.querySelector('#setup-ui button');
        if (!name) return alert("Enter a name!");

        joinBtn.innerText = "joining...";
        joinBtn.disabled = true;

        try{
            const response = await fetch('/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            });

            if (response.ok) {
                const data = await response.json();
                myPlayerId = data.id;
                localStorage.setItem('dirtyMoneyPlayerId', myPlayerId);
                document.getElementById('setup-ui').innerHTML = `<p style="color: var(--clr-authentic); font-family: var(--font-display); text-transform: uppercase;">✓ Joined as <b>${name}</b></p>`;
                console.log("Joined successfully! ID assigned:", myPlayerId);
                refreshLobby();
            } else {
                joinBtn.innerText = "enter";
                joinBtn.disabled = false;
                const errorData = await response.json();
                alert("Failed to join: " + (errorData.error || response.statusText));
            }
        } catch (err) {
            console.error("Network error:", err);
            joinBtn.innerText = "enter";
            joinBtn.disabled = false;
            alert("Could not connect to server.");
        }
    }

    document.getElementById('playerName').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            joinGame();
        }
    });

    async function toggleReady() {
        const btn = document.getElementById('readyBtn');
        const response = await fetch('/ready', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ playerId: myPlayerId })
        });

        if (response.ok) {
            const data = await response.json();
            btn.innerText = data.isReady ? "unready" : "mark ready";
        }
    }

    async function nominateSupplier(targetId) {
        const response = await fetch('/nominate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                traderId: myPlayerId, 
                supplierId: targetId 
            })
        });

        if (response.ok) {
            console.log("Nomination sent!");
            refreshLobby();
        } else {
            const err = await response.json();
            alert(err.error);
        }
    }

    async function sendVote(isYes) {
        const response = await fetch('/vote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                playerId: myPlayerId, 
                vote: isYes 
            })
        });
        if (response.ok) {
            console.log("Vote cast!");
            document.getElementById('voting-ui').style.display = 'none';
        }
    }

    document.addEventListener('keydown', (e) => {
        const votingUI = document.getElementById('voting-ui');
        if (votingUI.style.display === 'block') {
            const key = e.key.toLowerCase();
            if (key === 'y') sendVote(true);
            else if (key === 'n') sendVote(false);
        }
    });

    async function refreshLobby() {        
        try {
            const url = myPlayerId ? `/game-state?playerId=${myPlayerId}` : '/game-state';
            const response = await fetch(url);
            const data = await response.json();

            const setupUI = document.getElementById('setup-ui');
            const listElement = document.getElementById('playerList');

            if (!myPlayerId) {
                if (data.status !== 'LOBBY') {
                    setupUI.innerHTML = `<p style="color: var(--clr-fraudulent);">🚫 Game in progress</p>`;
                } else if (data.players.length >= 10) {
                    setupUI.innerHTML = `<p style="color: var(--clr-fraudulent);">🚫 Game Full (10/10)</p>`;
                }
            }

            listElement.innerHTML = '';
            if (data.players.length === 0) {
                const li = document.createElement('li');
                li.innerText = data.status !== 'LOBBY' ? "Game in progress..." : data.players.length >= 10 ? "Game Full" : "Waiting for players...";
                listElement.appendChild(li);
            }

            if (!myPlayerId) return;
            document.getElementById('gameStatus').innerText = data.status.toLowerCase();
            
            // Message box
            const msgBox = document.getElementById('game-message');
            if (data.lastResult) {
                msgBox.innerText = data.lastResult;
                msgBox.style.display = 'block';
                msgBox.classList.toggle('failure', data.lastResult.includes("FAIL") || data.lastResult.includes("FRAUDULENT"));
                msgBox.classList.toggle('success', !data.lastResult.includes("FAIL") && !data.lastResult.includes("FRAUDULENT"));
            } else {
                msgBox.style.display = 'none';
            }

            // Player list
            listElement.innerHTML = '';
            data.players.forEach((p, index) => {
                const li = document.createElement('li');
                const playerCard = document.createElement('div');
                playerCard.className = 'player-card';
                
                const readyUI = document.getElementById('ready-ui');
                readyUI.style.display = (myPlayerId && data.status === 'LOBBY') ? 'block' : 'none';

                if (!p.isAlive) {
                    li.style.opacity = "0.5";
                    const nameEl = document.createElement('span');
                    nameEl.className = 'player-name';
                    nameEl.innerHTML = `💀 <del>${p.name}</del>`;
                    playerCard.appendChild(nameEl);
                    const statusEl = document.createElement('span');
                    statusEl.className = 'player-status eliminated';
                    statusEl.innerText = 'fired';
                    playerCard.appendChild(statusEl);
                } else {
                    const nameEl = document.createElement('span');
                    nameEl.className = 'player-name';
                    nameEl.innerText = p.name;
                    playerCard.appendChild(nameEl);

                    const statusEl = document.createElement('span');
                    statusEl.className = 'player-status';
                    if (data.status === 'LOBBY' && p.isReady) {
                        statusEl.classList.add('ready');
                        statusEl.innerText = 'ready';
                    } else if (data.status === 'VOTING' && data.votes[p.id] !== undefined) {
                        statusEl.classList.add('voted');
                        statusEl.innerText = 'voted';
                    }
                    if (statusEl.innerText) playerCard.appendChild(statusEl);

                    // Identity badge
                    if (p.identity && p.id !== myPlayerId) {
                        const badge = document.createElement('span');
                        badge.className = 'badge badge-identity';
                        badge.innerText = p.identity.toUpperCase();
                        playerCard.appendChild(badge);
                    }

                    // Trader badge
                    if (data.status !== 'LOBBY' && index === data.traderIndex) {
                        const badge = document.createElement('span');
                        badge.className = 'badge badge-trader';
                        badge.innerText = 'trader';
                        playerCard.appendChild(badge);
                    }

                    // Supplier badge
                    const isNominated = data.nominatedSupplierId === p.id;
                    if (isNominated && (data.status === 'LEGISLATIVE' || data.status === 'POWER')) {
                        const badge = document.createElement('span');
                        badge.className = 'badge badge-supplier';
                        badge.innerText = 'supplier';
                        playerCard.appendChild(badge);
                    }
                }
                li.appendChild(playerCard);
                listElement.appendChild(li);
            });

            // Identity Reveal
            const me = data.players.find(p => p.id === myPlayerId);
            if (me && me.identity) {
                const card = document.getElementById('role-card');
                const roleDisplay = document.getElementById('myRole');
                card.style.display = 'block';
                roleDisplay.innerText = me.identity.toUpperCase();
                roleDisplay.style.color = (me.identity === 'Authentic') ? 'var(--clr-authentic)' : 'var(--clr-fraudulent)';
            }

            // Election Logic
            const electionUI = document.getElementById('election-ui');
            const candidateZone = document.getElementById('supplier-candidates');
            const isMyTurn = (data.status === 'ELECTION' && data.players[data.traderIndex].id === myPlayerId);

            if (isMyTurn && !data.nominatedSupplierId) {
                electionUI.style.display = 'block';
                if (candidateZone.children.length === 0) {
                    candidateZone.innerHTML = ''; 
                    data.players.forEach(p => {
                        if (p.id !== myPlayerId) {
                            const btn = document.createElement('button');
                            btn.className = 'btn-primary';
                            btn.innerText = p.name;
                            btn.onclick = () => nominateSupplier(p.id);
                            candidateZone.appendChild(btn);
                        }
                    });
                }
            } else {
                electionUI.style.display = 'none';
                candidateZone.innerHTML = '';
            }
            
            // Voting Logic
            const votingUI = document.getElementById('voting-ui');
            const votingAnnounce = document.getElementById('voting-announcement');
            const votingButtons = document.querySelectorAll('#voting-ui button');
            if (data.status === 'VOTING' && data.nominatedSupplierId) {
                votingUI.style.display = 'block';
                const haveVoted = data.votes && data.votes[myPlayerId] !== undefined;

                if (haveVoted) {
                    votingAnnounce.innerText = "Waiting for others to vote...";
                    votingButtons.forEach(b => b.style.display = 'none');
                } else {
                    const supplier = data.players.find(p => p.id === data.nominatedSupplierId);
                    votingAnnounce.innerText = `Should ${supplier.name} be the Supplier?`;
                    votingButtons.forEach(b => b.style.display = 'inline-flex');
                }
            } else {
                votingUI.style.display = 'none';
                votingButtons.forEach(b => b.style.display = 'inline-flex');
            }

            // Legislative Logic
            const legUI = document.getElementById('legislative-ui');
            const handContainer = document.getElementById('policy-hand');
            const handInstruction = document.getElementById('hand-instruction');

            const isTrader = data.players[data.traderIndex].id === myPlayerId;
            const isSupplier = data.nominatedSupplierId === myPlayerId;

            if (data.status === 'LEGISLATIVE' && (isTrader || isSupplier)) {
                legUI.style.display = 'block';
                const isTraderTurn = data.hand.length === 3;
                const isSupplierTurn = data.hand.length === 2;

                if (isTrader) {
                    handInstruction.innerText = isTraderTurn ? "you: select batch to discard" : "waiting for supplier...";
                } else if (isSupplier) {
                    handInstruction.innerText = isSupplierTurn ? "you: select batch to discard" : "waiting for trader...";
                }

                if ((isTrader && isTraderTurn) || (isSupplier && isSupplierTurn)) {
                    handContainer.innerHTML = '';
                    data.hand.forEach((policy, index) => {
                        const card = document.createElement('div');
                        card.className = `policy-card card-${policy.toLowerCase()}`;
                        card.innerText = policy;
                        card.onclick = () => discardCard(index);
                        handContainer.appendChild(card);
                    });
                } else {
                    handContainer.innerHTML = '';
                }
            } else {
                legUI.style.display = 'none';
            }

            // Scoreboard
            document.getElementById('score-auth').innerText = `${data.scores.authentic} / 5`;
            document.getElementById('score-fraud').innerText = `${data.scores.fraudulent} / 6`;
            document.getElementById('scoreboard').style.display = data.status === 'LOBBY' ? 'none' : 'grid';

            // Power Phase Logic
            const powerUI = document.getElementById('power-ui');
            const privateResult = document.getElementById('private-result');
            const targetZone = document.getElementById('power-targets');

            if (data.powerResult && isTrader && data.status !== 'END') {
                privateResult.style.display = 'block';
                privateResult.innerHTML = `
                <div>👁️ private intel</div>
                <div style="margin: var(--space-md) 0;">${data.powerResult}</div>
                <button class="btn-secondary" onclick="endPowerTurn()" style="margin-top: var(--space-md); width: 100%;">continue</button>
                `;
            } else {
                privateResult.style.display = 'none';
            }

            if (data.status === 'POWER' && isTrader && data.activePower && !data.powerResult) {
                powerUI.style.display = 'block';
                document.getElementById('power-title').innerText = data.activePower.replace('_', ' ');

                targetZone.innerHTML = '';
                if (data.activePower === 'INVESTIGATE' || data.activePower === 'EXECUTION' || data.activePower === 'SPECIAL_ELECTION') {
                    data.players.forEach(p => {
                        if (p.id !== myPlayerId && p.isAlive) {
                            const btn = document.createElement('button');
                            if (data.activePower === 'EXECUTION') {
                                btn.className = 'btn-danger';
                                btn.innerText = `fire ${p.name}`;
                            } else if (data.activePower === 'INVESTIGATE') {
                                btn.className = 'btn-secondary';
                                btn.innerText = `investigate ${p.name}`;
                            } else if (data.activePower === 'SPECIAL_ELECTION') {
                                btn.className = 'btn-secondary';
                                btn.innerText = `appoint ${p.name}`;
                            }
                            btn.onclick = () => usePower(p.id);
                            targetZone.appendChild(btn);
                        }
                    });
                } else if (data.activePower === 'POLICY_PEEK') {
                    const btn = document.createElement('button');
                    btn.className = 'btn-secondary';
                    btn.innerText = "view top 3 cards";
                    btn.onclick = () => usePower(null);
                    targetZone.appendChild(btn);
                }
            } else {
                powerUI.style.display = 'none';
            }

            // Funds Tracker
            const fundsDisplay = document.getElementById('funds-amount');
            const fundsTracker = document.getElementById('funds-tracker');
            
            if (data.status === 'LOBBY' || data.status === 'END') {
                fundsTracker.style.display = 'none';
            } else {
                fundsTracker.style.display = 'block';
                fundsDisplay.innerText = `€${data.funds}M`;
                fundsTracker.classList.toggle('warning', data.funds <= 1);
            }

        } catch (err) {
            console.error("Polling error:", err);
        }
    }

    async function discardCard(index) {
        const response = await fetch('/discard', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                playerId: myPlayerId, 
                cardIndex: index 
            })
        });

        if (response.ok) {
            console.log("Card discarded");
            refreshLobby();
        } else {
            const err = await response.json();
            alert(err.error);
        }
    }

    async function usePower(targetId) {
        console.log("Using power on:", targetId);
        const response = await fetch('/use-power', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ playerId: myPlayerId, targetId: targetId })
        });
        if (response.ok) {
            console.log("Power used!");
            refreshLobby();
        } else {
            const err = await response.json();
            alert(err.error);
        }
    }

    async function endPowerTurn() {
        await fetch('/end-power', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ playerId: myPlayerId })
        });
        refreshLobby();
    }

    window.onload = async () => {
        const savedId = localStorage.getItem('dirtyMoneyPlayerId');
        if (savedId) {
            const response = await fetch(`/game-state?playerId=${savedId}`);
            const data = await response.json();
            const stillInGame = data.players.find(p => p.id === savedId);
            
            if (stillInGame) {
                myPlayerId = savedId;
                document.getElementById('setup-ui').innerHTML = 
                    `<p style="color: var(--clr-authentic); font-family: var(--font-display); text-transform: uppercase;">✓ Reconnected as <b>${stillInGame.name}</b></p>`;
                console.log("Reconnected successfully:", myPlayerId);
            } else {
                localStorage.removeItem('dirtyMoneyPlayerId');
            }
        }
    };

    document.getElementById('playerName').focus();
    setInterval(refreshLobby, 2000);
</script>

</body>
</html>
