<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dirty Money | Investigation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Righteous&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <!-- Header -->
    <header class="header">
        <h1 class="header-title">dirty
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2" />
            <circle cx="12" cy="12" r="2" />
            <path d="M6 12h.01M18 12h.01" />
            </svg>
            money</h1>
        <p class="header-subtitle">food fraud investigation</p>
    </header>

    <!-- Join Game Setup -->
    <div id="setup-ui">
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Your Code Name...">
            <button class="btn-primary" onclick="joinGame()">enter</button>
        </div>
    </div>

    <!-- Role Reveal Card -->
    <div id="role-card">
        <h3>Player Profile</h3>
        <h2 id="myRole">???</h2>
        <p id="role-desc"></p>
    </div>

    <!-- Scoreboard / Board Tracks -->
    <div id="scoreboard">
        <!-- Authentic Track -->
        <div class="board-track">
            <div class="track-title authentic">authentic supply</div>
            <div class="track-squares authentic-track" id="authentic-track"></div>
        </div>

        <!-- Fraudulent Track -->
        <div class="board-track">
            <div class="track-title fraudulent">fraudulent supply</div>
            <div class="track-squares fraudulent-track" id="fraudulent-track"></div>
        </div>
    </div>

    <!-- Message Alert -->
    <div id="game-message"></div>

    <!-- Ready Button -->
    <div id="ready-ui">
        <button class="btn-secondary" id="readyBtn" onclick="toggleReady()" style="width: 100%;">mark ready</button>
    </div>

    <!-- Players Board -->
    <div class="players-section">
        <label class="section-label">players</label>
        <ul id="playerList"></ul>
    </div>

    <!-- Election Phase -->
    <div id="election-ui" class="zone">
        <div class="zone-title">nominate supplier</div>
        <p style="margin: var(--space-md) 0;">Select a player to nominate:</p>
        <div id="supplier-candidates" style="display: flex; flex-wrap: wrap; gap: var(--space-md);"></div>
    </div>

    <!-- Voting Phase -->
    <div id="voting-ui" class="zone">
        <div class="zone-title">cast your vote</div>
        <p id="voting-announcement" style="margin: var(--space-md) 0;"></p>
        <div style="display: flex; gap: var(--space-md); margin-top: var(--space-md);">
            <button class="btn-secondary" onclick="sendVote(true)" style="flex: 1;">✓ accept</button>
            <button class="btn-danger" onclick="sendVote(false)" style="flex: 1;">✗ reject</button>
        </div>
    </div>

    <!-- Legislative Phase -->
    <div id="legislative-ui" class="zone">
        <div class="zone-title">discard batch</div>
        <h4 id="hand-instruction" style="font-family: var(--font-body); text-transform: uppercase; letter-spacing: 1px; margin: var(--space-md) 0; color: var(--clr-text-muted);"></h4>
        <div id="policy-hand"></div>
    </div>

    <!-- Power Phase -->
    <div id="power-ui" class="zone">
        <div class="zone-title" id="power-title">special power</div>
        <div id="power-targets" style="display: flex; flex-wrap: wrap; gap: var(--space-md); margin-top: var(--space-md);"></div>
    </div>

    <!-- Private Results -->
    <div id="private-result"></div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">Investigation Phase</span>
            <span class="status-value" id="gameStatus">lobby</span>
        </div>
    </div>
</div>

<!-- Funds Tracker -->
<div id="funds-tracker">
    <div class="funds-label">company funds</div>
    <div id="funds-amount">€3M</div>
    <div class="funds-warning">Avoid bankruptcy</div>
</div>

<script src="script.js" defer></script>
</body>
</html>
