<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg 
    width="2.5in" 
    height="3.5in" 
    viewBox="0 0 225 315"
    xmlns:dc="http://purl.org/dc/elements/1.1/"
    xmlns:cc="http://creativecommons.org/ns#"
    xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
    
    <metadata>
        <rdf:RDF><cc:Work rdf:about=""><dc:format>image/svg+xml</dc:format><dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" /><dc:title>Dirty Money - TRICK-MEISTER</dc:title></cc:Work></rdf:RDF>
    </metadata>

    <!-- Card base -->
    <rect id="card-base" x="0" y="0" width="225" height="315" rx="8" fill="#200a0a" stroke="#ba293b" stroke-width="5"/>
    
    <!-- Top decorative line -->
    <line x1="20" y1="15" x2="205" y2="15" stroke="#ba293b" stroke-width="2" opacity="1" />
    
    <!-- Header -->
    <text x="112.5" y="32" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#ba293b" text-anchor="middle" letter-spacing="1">DIRTY MONEY</text>
    <text x="112.5" y="42" font-family="Courier New, monospace" font-size="10" fill="#ba293b" text-anchor="middle" opacity="1">CONFIDENTIAL</text>
    
    <!-- Divider -->
    <line x1="30" y1="50" x2="195" y2="50" stroke="#ba293b" stroke-width="2" opacity="1" />
    
    <!-- Person Silhouette - Head and shoulders -->
    <g transform="translate(112.5, 130)">
        <!-- Head circle -->
        <circle cx="0" cy="-25" r="22" fill="none" stroke="#ba293b" stroke-width="2" opacity="1"/>
        
        <!-- Shoulders/Body -->
        <path d="M -35 25 Q -35 5 -20 0 Q 0 -5 20 0 Q 35 5 35 25" 
              fill="none" stroke="#ba293b" stroke-width="2" opacity="1"/>
        
        <!-- Collar detail -->
        <path d="M -15 5 Q 0 12 15 5" fill="none" stroke="#ba293b" stroke-width="2" opacity="1"/>
    </g>
    
    <!-- Role Title -->
    <text x="112.5" y="175" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#ba293b" text-anchor="middle" letter-spacing="0.5">TRICK-MEISTER</text>
    
    <!-- Decorative line -->
    <line x1="60" y1="182" x2="165" y2="182" stroke="#ba293b" stroke-width="2" opacity="1" />
    
    <!-- Role description -->
    <text x="112.5" y="195" font-family="Arial, sans-serif" font-size="10" fill="#ba293b" text-anchor="middle" opacity="1">Master Manipulator</text>
    <text x="112.5" y="205" font-family="Arial, sans-serif" font-size="10" fill="#ba293b" text-anchor="middle" opacity="1"></text>

    <!-- Team indicator -->
    <g transform="translate(112.5, 250)">
        <rect x="-85" y="-25" width="170" height="40" rx="3" fill="none" stroke="#ba293b" stroke-width="1" opacity="1"/>
        <text x="0" y="4" font-family="Courier New, monospace" font-size="28" fill="#ba293b" text-anchor="middle" font-weight="bold">
            FRAUDSTER
        </text>
    </g>
    
    <!-- Footer -->
    <text x="112.5" y="295" font-family="Courier New, monospace" font-size="10" fill="#ba293b" text-anchor="middle" opacity="1">KEEP YOUR IDENTITY SECRET</text>
</svg>
