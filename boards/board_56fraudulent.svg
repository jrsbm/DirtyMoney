        <text x="70" y="30" font-family="Courier New, monospace" font-size="9" fill="#ba293b" text-anchor="middle" opacity="1">Reorganisation</text>
        <text x="70" y="100" font-family="Courier New, monospace" font-size="9" fill="#ba293b" text-anchor="middle" opacity="0.35">SLOT 5</text>
        <text x="70" y="160" font-family="Courier New, monospace" font-size="9" fill="#ba293b" text-anchor="middle" opacity="1">The trader must</text> 
