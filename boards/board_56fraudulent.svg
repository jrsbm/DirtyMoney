    <text x="225" y="286" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#200a0a" opacity="0.8">5 OR 6 PLAYERS: PLAY WITH 1 FRAUDSTER AND TRICK-MEISTER, TRICK-MEISTER KNOWS WHO THE FRAUDSTER IS</text>

